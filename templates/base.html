<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharatRail — Indian Railways Reservation & DBMS Analytics</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Plus Jakarta Sans) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        
        @keyframes floatBlob {
            0%, 100% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.08); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }
        .animate-blob { animation: floatBlob 14s infinite ease-in-out; }
        .animation-delay-2000 { animation-delay: 2s; }
        .animation-delay-4000 { animation-delay: 4s; }

        @keyframes modalEnter {
            from { opacity: 0; transform: scale(0.98) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-enter { animation: modalEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="bg-[#FAF7F2] text-stone-800 min-h-screen flex flex-col relative overflow-x-hidden antialiased">

    <!-- Creamy Ambient Background Glows -->
    <div class="fixed inset-0 pointer-events-none z-0 overflow-hidden opacity-60">
        <div class="absolute -top-24 -left-20 w-96 h-96 bg-amber-200/40 rounded-full blur-3xl animate-blob"></div>
        <div class="absolute top-1/2 -right-24 w-[30rem] h-[30rem] bg-orange-200/30 rounded-full blur-3xl animate-blob animation-delay-2000"></div>
        <div class="absolute -bottom-20 left-1/3 w-96 h-96 bg-yellow-200/40 rounded-full blur-3xl animate-blob animation-delay-4000"></div>
    </div>

    <!-- Creamy & White Navbar -->
    <nav class="sticky top-0 z-50 backdrop-blur-xl bg-[#F3ECE1]/80 border-b border-amber-200/60 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3 group">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-tr from-amber-600 to-amber-700 flex items-center justify-center text-white shadow-md shadow-amber-900/10 group-hover:scale-105 transition duration-300">
                    <i class="fa-solid fa-train-subway text-xl"></i>
                </div>
                <div>
                    <span class="text-2xl font-extrabold tracking-tight text-stone-900">BharatRail</span>
                    <span class="block text-[10px] font-bold tracking-widest uppercase text-amber-800">Indian Railways DBMS Project</span>
                </div>
            </a>

            <div class="flex items-center space-x-2 md:space-x-3">
                <a href="/" class="px-3.5 py-2 rounded-xl text-sm font-semibold text-stone-700 hover:text-stone-900 hover:bg-white/80 transition duration-200">
                    <i class="fa-solid fa-compass text-amber-700 mr-1.5"></i> Book Tickets
                </a>
                <a href="/bookings" class="px-3.5 py-2 rounded-xl text-sm font-semibold text-stone-700 hover:text-stone-900 hover:bg-white/80 transition duration-200">
                    <i class="fa-solid fa-receipt text-amber-700 mr-1.5"></i> View Bookings
                </a>
                <a href="/analytics" class="px-3.5 py-2 rounded-xl text-sm font-semibold text-stone-700 hover:text-stone-900 hover:bg-white/80 transition duration-200">
                    <i class="fa-solid fa-chart-pie text-amber-700 mr-1.5"></i> Analytics & Joins
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow z-10 w-full animate-enter">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="border-t border-amber-200/60 bg-[#F3ECE1]/60 backdrop-blur-md py-6 text-center text-xs text-stone-600 z-10">
        <p class="font-medium">© 2026 BharatRail Reservation System • Heli Mehta DBMS Mini Project</p>
    </footer>
</body>
</html>
